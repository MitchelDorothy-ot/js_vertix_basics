<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Switch Case</title>
</head>
<body>
<script>
    let day = prompt('Enter day of the week', 1)
    switch (+day) {
        case 1:
            console.log("Overtime salary is $200/hr")
            break
        case 2:
            console.log("Overtime salary is $250/hr")
            break
        case 3:
            console.log("Overtime salary is $350/hr")
            break
        case 4:
            console.log("Overtime salary is $400/hr")
            break
        case 5:
            console.log("Overtime salary is $450/hr")
            break
        default:
            console.log("No pay for other days")

    }

</script>
</body>
</html>
