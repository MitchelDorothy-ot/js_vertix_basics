<script>
    let x = 10
    const PI = 22 / 7
    //template literals
    console.log(`${x} PI is ${PI}`)

    const add = (a, b) => a + b

    function multiply(a, b) {
        return a * b
    }

    console.log(add(1, 2))

    //destructuring //unpack values
    const patient = {
        name: "Jim John",
        dob: "18/12/1999",
        gender: "male",
    }
    // let name = patient.name
    // let dob = patient.dob
    // let gender = patient.gender

    const {gender, name, dob} = patient
    console.log(`Patient name is ${name} and gender is ${gender}`)

    let details = [name1, name2] = details

    function divide(a, b, rounded = false) {
        let res = a / b
        if (rounded === true) {
            return Math.round(res)
        }
        return res

    }

    let res1 = divide(10, 3, true)
    let res2 = divide(10, 3)

    console.log(res1, res2)

    //spread operator
    function flexibleAdd(...nums) {
        let total = 0
        for (let value of nums) {
            total += value
        }
        return total
    }

    console.log(flexibleAdd(10, 20, 30, 40))

    let people = ["Jill", "Jack", "John"]
    let others = ["Jeremy", "June"]

    let merged = [...people, ...others]
    console.log(merged)

    let data = [...people, "Hilda", "Aisha"]

    function volume_sphere(r) {
        let res = 4 / 3 * 22 / 7 * r ** 3
        return res
    }


    function surface_area_sphere(r) {
        return 4 * 22 / 7 * r ** 2
    }

    const area_circle = (r) => 22 / 7 * r ** 2


</script>
